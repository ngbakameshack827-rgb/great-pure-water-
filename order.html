<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Order Water - Great table Water</title>

<link rel="stylesheet" href="style.css">

<style>
.order-section{
    max-width:700px;
    margin:50px auto;
    background:#fff;
    padding:30px;
    border-radius:12px;
    box-shadow:0 5px 15px rgba(0,0,0,.1);
}

.order-section h1{
    text-align:center;
    color:#0077cc;
    margin-bottom:20px;
}

.order-section input,
.order-section select,
.order-section textarea{
    width:100%;
    padding:12px;
    margin:10px 0;
    border:1px solid #ccc;
    border-radius:8px;
    font-size:16px;
}

.order-section button{
    width:100%;
    padding:15px;
    background:#0077cc;
    color:#fff;
    border:none;
    border-radius:8px;
    font-size:18px;
    cursor:pointer;
}

.order-section button:hover{
    background:#005fa3;
}
</style>

</head>
<body>

<header>
<nav class="navbar">
<h2 class="logo">💧 Great table Water</h2>

<ul class="nav-links">
<li><a href="index.html">Home</a></li>
<li><a href="about.html">About</a></li>
<li><a href="order.html">Order</a></li>
</ul>
</nav>
</header>

<section class="order-section">

<h1>Place Your Order</h1>

<form>

<input type="text" placeholder="Full Name" required>

<input type="tel" placeholder="Phone Number" required>

<input type="email" placeholder="Email Address" required>

<textarea placeholder="Delivery Address" rows="4" required></textarea>

<select required>
<option value="">Select Water Type</option>
<option>Sachet Water</option>
<option>Bottled Water</option>
<option>Dispenser Refill</option>
</select>

<input type="number" placeholder="Quantity" required>

<input type="date" required>

<button type="submit">Submit Order</button>

</form>

</section>

<footer>
<p>© 2026 Great table Water Company. All Rights Reserved.</p>
</footer>

<script src="main.js"></script>

</body>
</html>
